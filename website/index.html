<!DOCTYPE html>

<html lang="pt-BR">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Blog Lab05</title>

<link
    rel="stylesheet"
    href="css/style.css"
>
```

</head>

<body>

```
<h1>Blog Lab05</h1>


<!-- LOGIN -->

<section id="loginSection">

    <h2>Login</h2>

    <form id="loginForm">

        <label for="email">
            E-mail
        </label>

        <input
            type="email"
            id="email"
            placeholder="seu@email.com"
            required
        >


        <label for="password">
            Senha
        </label>

        <input
            type="password"
            id="password"
            placeholder="Sua senha"
            required
        >


        <button type="submit">
            Entrar
        </button>

    </form>

</section>


<!-- USUÁRIO AUTENTICADO -->

<section id="userSection" hidden>

    <h2>
        Área autenticada
    </h2>


    <p id="status"></p>


    <hr>


    <!-- CRIAR POST -->

    <h3>
        Criar post
    </h3>


    <form id="postForm">

        <label for="postTitle">
            Título
        </label>

        <input
            type="text"
            id="postTitle"
            placeholder="Título do post"
            required
        >


        <label for="postContent">
            Conteúdo
        </label>

        <textarea
            id="postContent"
            rows="6"
            placeholder="Escreva seu post..."
            required
        ></textarea>


        <button type="submit">
            Criar post
        </button>

    </form>


    <button id="logoutButton">
        Sair
    </button>

</section>


<section id="postsSection">
    <h2>Posts</h2>

    <div id="postsContainer">
        Carregando posts...
    </div>
</section>



<p id="message"></p>


<script src="js/app.js"></script>
```

</body>

</html>
