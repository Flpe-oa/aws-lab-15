<body>

```
<h1>Blog Lab05</h1>

<!-- LOGIN -->
<section id="loginSection">

    <h2>Login</h2>

    <form id="loginForm">

        <label for="email">E-mail</label>
        <input
            type="email"
            id="email"
            placeholder="seu@email.com"
            required
        >

        <label for="password">Senha</label>
        <input
            type="password"
            id="password"
            placeholder="Sua senha"
            required
        >

        <button type="submit">
            Entrar
        </button>

    </form>

</section>


<!-- USUÁRIO AUTENTICADO -->
<section id="userSection" hidden>

    <h2>Área autenticada</h2>

    <p id="status"></p>

    <button id="logoutButton">
        Sair
    </button>

</section>


<p id="message"></p>


<script>

    const REGION = "us-east-1";

    const CLIENT_ID = "71utepr0igeflh87gp5do5eime";


    let accessToken = null;


    const loginForm = document.getElementById("loginForm");

    const loginSection = document.getElementById("loginSection");

    const userSection = document.getElementById("userSection");

    const logoutButton = document.getElementById("logoutButton");

    const status = document.getElementById("status");

    const message = document.getElementById("message");


    /*
     * LOGIN
     */
    loginForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value;

        const password = document.getElementById("password").value;


        message.textContent = "Realizando login...";


        try {

            const response = await fetch(
                `https://cognito-idp.${REGION}.amazonaws.com/`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/x-amz-json-1.1",
                        "X-Amz-Target":
                            "AWSCognitoIdentityProviderService.InitiateAuth"
                    },

                    body: JSON.stringify({

                        AuthFlow: "USER_PASSWORD_AUTH",

                        ClientId: CLIENT_ID,

                        AuthParameters: {
                            USERNAME: email,
                            PASSWORD: password
                        }

                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message || "Erro ao realizar login."
                );

            }


            /*
             * Guardamos o Access Token apenas
             * enquanto a página estiver aberta.
             */
            accessToken =
                data.AuthenticationResult.AccessToken;


            /*
             * Alteramos a interface.
             */
            loginSection.hidden = true;

            userSection.hidden = false;


            status.textContent =
                `Autenticado como ${email}`;


            message.textContent =
                "Login realizado com sucesso!";


            /*
             * Não mostramos o JWT.
             *
             * Apenas confirmamos que recebemos.
             */
            console.log(
                "Login realizado. AccessToken recebido:",
                Boolean(accessToken)
            );

        }

        catch (error) {

            console.error(error);

            message.textContent =
                error.message || "Erro ao realizar login.";

        }

    });


    /*
     * LOGOUT
     */
    logoutButton.addEventListener("click", function() {

        /*
         * Apaga o token da memória.
         */
        accessToken = null;


        /*
         * Limpa o formulário.
         */
        loginForm.reset();


        /*
         * Volta para a tela de login.
         */
        loginSection.hidden = false;

        userSection.hidden = true;


        status.textContent = "";

        message.textContent =
            "Sessão encerrada.";


        console.log("Logout realizado.");

    });

</script>
```
